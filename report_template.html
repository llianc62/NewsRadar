<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻速报 — {{DATE}} {{TIME}}</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #fafafa;
        color: #333;
        line-height: 1.5;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .header {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        padding: 32px 24px;
        text-align: center;
    }
    .header-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 20px 0;
    }
    .header-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        font-size: 14px;
        opacity: 0.95;
    }
    .info-item { text-align: center; }
    .info-label { display: block; font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
    .info-value { font-weight: 600; font-size: 16px; }
    .content { padding: 24px; }
    .word-group { margin-bottom: 40px; }
    .word-group:first-child { margin-top: 0; }
    .word-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 8px;
        border-bottom: 1px solid #f0f0f0;
    }
    .word-info { display: flex; align-items: center; gap: 12px; }
    .word-name { font-size: 17px; font-weight: 600; color: #1a1a1a; }
    .word-count { color: #666; font-size: 13px; font-weight: 500; }
    .word-index { color: #999; font-size: 12px; }
    .news-item {
        margin-bottom: 20px;
        padding: 16px 0;
        border-bottom: 1px solid #f5f5f5;
        position: relative;
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .news-item:last-child { border-bottom: none; }
    .news-number {
        color: #999;
        font-size: 13px;
        font-weight: 600;
        min-width: 20px;
        text-align: center;
        flex-shrink: 0;
        background: #f8f9fa;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: flex-start;
        margin-top: 8px;
    }
    .news-content { flex: 1; min-width: 0; }
    .news-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
    }
    .source-name { color: #666; font-size: 12px; font-weight: 500; }
    .tier-badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 6px;
        border-radius: 4px;
    }
    .rank-num {
        color: #fff;
        background: #6b7280;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 10px;
        min-width: 18px;
        text-align: center;
    }
    .rank-num.top { background: #dc2626; }
    .rank-num.high { background: #ea580c; }
    .news-title { font-size: 15px; line-height: 1.4; color: #1a1a1a; margin: 0; }
    .news-link { color: #2563eb; text-decoration: none; }
    .news-link:hover { text-decoration: underline; }
    .news-link:visited { color: #7c3aed; }
    .footer {
        margin-top: 32px;
        padding: 20px 24px;
        background: #f8f9fa;
        border-top: 1px solid #e5e7eb;
        text-align: center;
    }
    .footer-content { font-size: 13px; color: #6b7280; line-height: 1.6; }
    .project-name { font-weight: 600; color: #374151; }
    @media (max-width: 480px) {
        body { padding: 12px; }
        .header { padding: 24px 20px; }
        .content { padding: 20px; }
        .footer { padding: 16px 20px; }
        .header-info { grid-template-columns: 1fr; gap: 12px; }
        .news-header { gap: 6px; }
        .news-item { gap: 8px; }
        .news-number { width: 20px; height: 20px; font-size: 12px; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-title">&#x1F4F0; 新闻速报</div>
        <div class="header-info">
            <div class="info-item">
                <span class="info-label">报告日期</span>
                <span class="info-value">{{DATE}}</span>
            </div>
            <div class="info-item">
                <span class="info-label">生成时间</span>
                <span class="info-value">{{TIME}}</span>
            </div>
            <div class="info-item">
                <span class="info-label">新闻总数</span>
                <span class="info-value">{{TOTAL_COUNT}} 条</span>
            </div>
            <div class="info-item">
                <span class="info-label">匹配分组</span>
                <span class="info-value">{{GROUP_COUNT}} 组</span>
            </div>
        </div>
    </div>
    <div class="content">

        <!-- DEMO: 以下为模拟数据，实际渲染时替换为实际内容 -->
        <!-- 每组结构：
        <div class="word-group">
            <div class="word-header">
                <div class="word-info">
                    <div class="word-name">关键词组名</div>
                    <div class="word-count">N 条</div>
                </div>
                <div class="word-index">1/N</div>
            </div>
            <div class="news-item">
                <div class="news-number">1</div>
                <div class="news-content">
                    <div class="news-header">
                        <span class="rank-num top">#1</span>
                        <span class="tier-badge" style="background:#eff6ff;color:#2563eb;">T2·主流</span>
                        <span class="source-name">华尔街见闻</span>
                    </div>
                    <div class="news-title"><a href="#" target="_blank" class="news-link">这是一条模拟新闻标题</a></div>
                </div>
            </div>
            <div class="news-item">
                <div class="news-number">2</div>
                <div class="news-content">
                    <div class="news-header">
                        <span class="rank-num high">#5</span>
                        <span class="tier-badge" style="background:#fffbeb;color:#d97706;">T3·垂直</span>
                        <span class="source-name">36氪</span>
                    </div>
                    <div class="news-title"><a href="#" target="_blank" class="news-link">又一条模拟新闻标题</a></div>
                </div>
            </div>
        </div>
        -->

        {{CONTENT}}

    </div>
    <div class="footer">
        <div class="footer-content">
            由 <span class="project-name">NewsNow Crawler</span> 自动生成
        </div>
    </div>
</div>
</body>
</html>
