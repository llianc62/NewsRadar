app:
  timezone: "Asia/Shanghai"

crawler:
  newsnow:
    enabled: true
    timeout: 20
    interval: 2000
    url: "https://newsnow.busiyi.world/api/s"
    sources:
      - id: "wallstreetcn-hot"
        name: "华尔街见闻"
        tier: 2
        priority: 85
      - id: "cls-hot"
        name: "财联社热门"
        tier: 2
        priority: 85
      - id: "thepaper"
        name: "澎湃新闻"
        tier: 2
        priority: 75
      - id: "36kr-renqi"
        name: "36氪"
        tier: 3
        priority: 60
      - id: "toutiao"
        name: "今日头条"
        tier: 4
        priority: 30
      - id: "juejin"
        name: "掘金"
        tier: 4
        priority: 20

  rss:
    enabled: true
    timeout: 20
    interval: 1000
    feeds:
      - id: "stcn"
        name: "证券时报网"
        url: "https://rsshub.pseudoyu.com/stcn"
        tier: 2
        priority: 80
        enabled: true
        max_age_days: 1


notification:
  frequency_words: "news/frequency_words.txt"
  max_news_per_keyword: 0
  email:
    smtp_server: "smtp.qq.com"
    smtp_port: 587
    from_addr: ""
    to_addr: ""
    password: ""

storage:
  local:
    data_dir: "output"
  remote:
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""

postgresql:
  host: "localhost"
  port: 5432
  database: "newsradar"
  user: "newsradar"
  password: "newsradar"
  min_connections: 2
  max_connections: 10

minio:
  endpoint_url: "http://localhost:9000"
  bucket_name: "newsradar-images"
  access_key_id: "admin"
  secret_access_key: "minioadmin"
  region: ""

web:
  host: "0.0.0.0"
  port: 8000
