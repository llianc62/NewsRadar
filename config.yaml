app:
  timezone: "Asia/Shanghai"

crawler:
  newsnow:
    enabled: true
    timeout: 20
    interval: 2000
    url: "https://newsnow.busiyi.world/api/s"
    sources:
      # ── T1 主流财经 ──
      - id: "wallstreetcn-hot"
        name: "华尔街见闻"
        tier: 1
        priority: 85
      - id: "wallstreetcn-news"
        name: "华尔街见闻"
        tier: 1
        priority: 80
      - id: "cls-hot"
        name: "财联社"
        tier: 1
        priority: 85
      - id: "cls-depth"
        name: "财联社"
        tier: 1
        priority: 80
      - id: "fastbull-news"
        name: "法布财经"
        tier: 1
        priority: 80
      # ── T2 综合新闻 ──
      - id: "thepaper"
        name: "澎湃新闻"
        tier: 2
        priority: 75
      - id: "zaobao"
        name: "联合早报"
        tier: 2
        priority: 75
      - id: "cankaoxiaoxi"
        name: "参考新闻"
        tier: 2
        priority: 75
      - id: "kaopu"
        name: "靠谱新闻"
        tier: 2
        priority: 75
      - id: "ifeng"
        name: "凤凰网"
        tier: 2
        priority: 70
      # ── T3 垂直深度 ──
      - id: "ithome"
        name: "IT之家"
        tier: 4
        priority: 35
      # ── T4 内容资讯 ──
      - id: "juejin"
        name: "稀土掘金"
        tier: 4
        priority: 35
      - id: "sspai"
        name: "少数派"
        tier: 4
        priority: 35

  rss:
    enabled: true
    timeout: 20
    interval: 1000
    feeds:
      # ═══ 官方媒体 ═══
      - id: "xinhua-politics"
        name: "新华社·时政"
        url: "http://www.xinhuanet.com/politics/news_politics.xml"
        tier: 1
        priority: 88
        enabled: true
        max_age_days: 1
      - id: "xinhua-finance"
        name: "新华社·财经"
        url: "http://www.xinhuanet.com/fortune/news_fortune.xml"
        tier: 1
        priority: 85
        enabled: true
        max_age_days: 1
      - id: "xinhua-world"
        name: "新华社·国际"
        url: "http://www.xinhuanet.com/world/news_world.xml"
        tier: 2
        priority: 78
        enabled: true
        max_age_days: 1
      - id: "people"
        name: "人民日报"
        url: "https://rsshub.rssforever.com/people"
        tier: 2
        priority: 80
        enabled: true
        max_age_days: 1
      - id: "huanqiu"
        name: "环球时报"
        url: "https://rsshub.rssforever.com/huanqiu/news"
        tier: 2
        priority: 75
        enabled: true
        max_age_days: 1
      # ═══ 宏观经济/政策 ═══
      - id: "yicai-news"
        name: "第一财经"
        url: "https://rsshub.rssforever.com/yicai/news"
        tier: 1
        priority: 85
        enabled: true
        max_age_days: 1
      - id: "gelonghui-hot"
        name: "格隆汇"
        url: "https://rsshub.rssforever.com/gelonghui/hot-article"
        tier: 2
        priority: 80
        enabled: true
        max_age_days: 2
      # ═══ 市场快讯 ═══
      - id: "jin10"
        name: "金十数据"
        url: "https://rsshub.rssforever.com/jin10"
        tier: 2
        priority: 88
        enabled: false
        max_age_days: 1
      # ═══ 金融资讯 ═══
      - id: "stcn-hot"
        name: "证券时报"
        url: "https://rsshub.rssforever.com/stcn/article/rank/yw"
        tier: 2
        priority: 82
        enabled: true
        max_age_days: 1
      - id: "jiemian-finance"
        name: "界面财经"
        url: "https://rsshub.rssforever.com/jiemian/lists/1"
        tier: 3
        priority: 62
        enabled: true
        max_age_days: 1
      # ═══ 股票信息 ═══
      - id: "eastmoney-stock"
        name: "东方财富·A股"
        url: "https://rsshub.rssforever.com/eastmoney/a"
        tier: 2
        priority: 78
        enabled: false
        max_age_days: 1
      # ═══ 国际/世界格局 ═══
      - id: "bloomberg"
        name: "彭博社"
        url: "https://rsshub.rssforever.com/bloomberg"
        tier: 2
        priority: 80
        enabled: false
        max_age_days: 2
      - id: "bbc-world"
        name: "BBC国际"
        url: "https://rsshub.rssforever.com/bbc/world"
        tier: 2
        priority: 74
        enabled: false
        max_age_days: 2
      - id: "cctv-world"
        name: "央视国际"
        url: "https://rsshub.rssforever.com/cctv/world"
        tier: 2
        priority: 80
        enabled: true
        max_age_days: 2
      - id: "aljazeera-en"
        name: "半岛电视台"
        url: "https://rsshub.rssforever.com/aljazeera/english"
        tier: 3
        priority: 56
        enabled: false
        max_age_days: 2
      - id: "yahoo-finance"
        name: "雅虎财经"
        url: "https://finance.yahoo.com/news/rssindex"
        tier: 2
        priority: 75
        enabled: false
        max_age_days: 1
      # ═══ 科技创投 ═══
      - id: "36kr-news"
        name: "36氪"
        url: "https://rsshub.rssforever.com/36kr/news/latest"
        tier: 3
        priority: 65
        enabled: true
        max_age_days: 1
      - id: "ifanr"
        name: "爱范儿"
        url: "https://www.ifanr.com/feed"
        tier: 3
        priority: 58
        enabled: true
        max_age_days: 1
      - id: "huxiu"
        name: "虎嗅"
        url: "https://rss.huxiu.com/"
        tier: 2
        priority: 72
        enabled: false
        max_age_days: 1


