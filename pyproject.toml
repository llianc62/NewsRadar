[project]
name = "newsnow-crawler"
version = "2.0.0"
description = "NewsRadar — news aggregation, notification, and web dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "requests>=2.33",
    "boto3>=1.42",
    "PyYAML>=6.0",
    "pytz>=2026.1",
    "feedparser>=6.0",
    "psycopg2-binary>=2.9",
    "trafilatura>=2.0",
    "mistune>=3.2.1",
    "typer>=0.26.7",
    "jieba>=0.42",
    "readability-lxml>=0.8",
    "lxml>=6.0",
    "markdownify>=1.0",
    "playwright>=1.61.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: Integration tests that require external services (PostgreSQL, MinIO, httpbin.org).",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
