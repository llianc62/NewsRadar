{% extends "base.html" %}
{% block content %}
<article class="news-detail">
  <h1>{{ article.title }}</h1>
  <div class="news-meta">
    <span>{{ article.source_name }}</span>
    <span>{{ article.published_at or '' }}</span>
  </div>
  <div class="news-content">
    {{ article.content | safe if article.content else article.summary }}
  </div>
</article>
{% endblock %}
