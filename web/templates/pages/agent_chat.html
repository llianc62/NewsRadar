{% extends "base.html" %}
{% block title %}AI 助手 - NewsRadar{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/agent_chat.css?v=2">
{% endblock %}
{% block content %}
<div class="app-main">
  <div class="chat-container">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="section-header-line"></div>
        <div>
          <h1 class="chat-title">AI 助手</h1>
          <div class="chat-subtitle">基于新闻数据的智能问答</div>
        </div>
      </div>
      <div class="chat-header-right">
        <div class="model-segmented" role="tablist" aria-label="模型选择">
          <button class="model-seg active" data-model="quick" role="tab" aria-selected="true">
            <span class="dot"></span>Quick 快速
          </button>
          <button class="model-seg" data-model="deep" role="tab" aria-selected="false">
            <span class="dot"></span>Deep 深度
          </button>
        </div>
      </div>
    </header>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>
        </div>
        <div class="chat-empty-title">有什么想了解的？</div>
        <div class="chat-empty-desc">问我任何关于市场热点、个股动态或行业趋势的问题，我会基于 NewsRadar 的新闻数据为你分析。</div>
        <div class="chat-suggestions">
          <button class="chat-suggestion" data-prompt="今天市场有什么热点？">今天市场有什么热点？</button>
          <button class="chat-suggestion" data-prompt="帮我分析一下当前的舆论情绪">帮我分析一下当前的舆论情绪</button>
          <button class="chat-suggestion" data-prompt="最近有哪些值得关注的个股动态？">最近有哪些值得关注的个股动态？</button>
        </div>
      </div>
    </div>

    <div class="chat-composer">
      <div class="composer-shell" id="composer-shell">
        <div class="composer-input-row">
          <textarea
            id="chat-input"
            class="chat-input"
            placeholder="输入消息，向 AI 助手提问…"
            rows="1"
          ></textarea>
          <div class="composer-actions">
            <button id="send-btn" class="send-btn" title="发送 (Enter)" aria-label="发送" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
            <button id="stop-btn" class="stop-btn hidden" title="停止生成" aria-label="停止生成">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-footer">
          <div class="composer-hint">
            <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  'use strict';

  var SPARKLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>';
  var USER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

  var messagesEl = document.getElementById('chat-messages');
  var inputEl = document.getElementById('chat-input');
  var sendBtn = document.getElementById('send-btn');
  var stopBtn = document.getElementById('stop-btn');
  var modelSegs = document.querySelectorAll('.model-seg');
  var suggestions = document.querySelectorAll('.chat-suggestion');
  var currentModel = 'quick';
  var sessionId = null;
  var ws = null;
  var isGenerating = false;
  var currentBubble = null;

  // ── WebSocket 连接 ──
  function connectWS() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = protocol + '//' + location.host + '/api/ws';
    ws = new WebSocket(url);

    ws.onopen = function() { console.log('[WS] connected'); };
    ws.onmessage = function(e) {
      try { handleMessage(JSON.parse(e.data)); }
      catch (err) { console.error('[WS] parse error', err); }
    };
    ws.onclose = function() {
      console.log('[WS] disconnected, reconnecting in 3s...');
      setTimeout(connectWS, 3000);
    };
    ws.onerror = function(err) { console.error('[WS] error', err); };
  }

  function handleMessage(data) {
    switch (data.type) {
      case 'token': appendToken(data.content); break;
      case 'done':  finishMessage(data); break;
      case 'error': showError(data.message); break;
      case 'notification': showNotification(data.notification); break;
    }
  }

  // ── 消息渲染 ──
  function ensureBubble() {
    if (currentBubble) return currentBubble;
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    currentBubble = document.createElement('div');
    currentBubble.className = 'chat-bubble assistant';
    currentBubble.innerHTML =
      '<div class="bubble-avatar">' + SPARKLE_SVG + '</div>' +
      '<div class="bubble-content"></div>';
    messagesEl.appendChild(currentBubble);
    return currentBubble;
  }

  function showTyping() {
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    currentBubble = document.createElement('div');
    currentBubble.className = 'chat-bubble assistant';
    currentBubble.innerHTML =
      '<div class="bubble-avatar">' + SPARKLE_SVG + '</div>' +
      '<div class="bubble-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(currentBubble);
    scrollToBottom();
  }

  function appendToken(token) {
    var bubble = ensureBubble();
    var content = bubble.querySelector('.bubble-content');
    // 流式渲染期间：清掉 typing 占位，仅用 textContent 累加，避免 XSS 与性能问题
    if (content.querySelector('.typing-dots')) content.innerHTML = '';
    content.textContent += token;
    scrollToBottom();
  }

  function finishMessage(data) {
    if (currentBubble) {
      var content = currentBubble.querySelector('.bubble-content');
      if (content.querySelector('.typing-dots')) {
        // 没有收到任何 token
        currentBubble.remove();
      } else {
        // 完成时（含被停止）做一次 Markdown 渲染，marked 能优雅处理不完整内容
        try {
          content.innerHTML = marked.parse(content.textContent);
        } catch (e) {
          /* marked 加载失败时保留纯文本 */
        }
      }
    }
    currentBubble = null;
    setGenerating(false);
  }

  function showError(msg) {
    // 移除仍在 typing 的占位气泡
    if (currentBubble && currentBubble.querySelector('.typing-dots')) {
      currentBubble.remove();
    }
    currentBubble = null;

    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    var el = document.createElement('div');
    el.className = 'chat-bubble error';
    el.innerHTML = '<div class="bubble-content">⚠️ ' + escapeHtml(msg) + '</div>';
    messagesEl.appendChild(el);
    setGenerating(false);
    scrollToBottom();
  }

  function showNotification(notif) {
    if (typeof window.showAppToast === 'function') {
      window.showAppToast(
        notif.title,
        notif.summary || (notif.status === 'completed' ? '任务完成' : '任务失败'),
        notif.status === 'completed' ? 'done' : 'fail'
      );
    }
  }

  function addUserMessage(text) {
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    var el = document.createElement('div');
    el.className = 'chat-bubble user';
    el.innerHTML =
      '<div class="bubble-avatar">' + USER_SVG + '</div>' +
      '<div class="bubble-content">' + escapeHtml(text) + '</div>';
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  // ── 发送消息 ──
  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text || isGenerating) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showError('连接未就绪，请稍后重试');
      return;
    }

    if (!sessionId) {
      createSession().then(function() { doSend(text); });
    } else {
      doSend(text);
    }
  }

  function doSend(text) {
    addUserMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    updateSendState();
    setGenerating(true);
    showTyping();

    ws.send(JSON.stringify({
      type: 'chat',
      session_id: sessionId,
      message: text,
      model: currentModel,
    }));
  }

  function stopGeneration() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
    }
    setGenerating(false);
  }

  function setGenerating(generating) {
    isGenerating = generating;
    sendBtn.classList.toggle('hidden', generating);
    stopBtn.classList.toggle('hidden', !generating);
    inputEl.disabled = generating;
    if (!generating) updateSendState();
  }

  function updateSendState() {
    sendBtn.disabled = isGenerating || inputEl.value.trim() === '';
  }

  // ── Session 管理 ──
  async function createSession() {
    var resp = await fetch('/api/agent/sessions', { method: 'POST' });
    var data = await resp.json();
    sessionId = data.id;
    return sessionId;
  }

  // ── 初始化 ──
  async function init() {
    try {
      var resp = await fetch('/api/agent/sessions?page=1&page_size=1');
      var data = await resp.json();
      if (data.sessions && data.sessions.length > 0) {
        sessionId = data.sessions[0].id;
      } else {
        await createSession();
      }
    } catch (e) {
      await createSession();
    }
    connectWS();
  }

  // ── 辅助函数 ──
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── 事件绑定 ──
  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', stopGeneration);

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    updateSendState();
  });

  modelSegs.forEach(function(seg) {
    seg.addEventListener('click', function() {
      if (isGenerating) return;
      modelSegs.forEach(function(s) {
        s.classList.remove('active');
        s.setAttribute('aria-selected', 'false');
      });
      seg.classList.add('active');
      seg.setAttribute('aria-selected', 'true');
      currentModel = seg.dataset.model;
    });
  });

  suggestions.forEach(function(chip) {
    chip.addEventListener('click', function() {
      inputEl.value = chip.dataset.prompt;
      inputEl.focus();
      inputEl.dispatchEvent(new Event('input'));
    });
  });

  // ── 启动 ──
  init();
})();
</script>
{% endblock %}
