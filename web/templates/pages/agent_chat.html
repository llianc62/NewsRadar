{% extends "base.html" %}
{% block title %}AI 助手 - NewsRadar{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/agent_chat.css?v=6">
{% endblock %}
{% block content %}
<div class="app-main">
  <!-- ── 左侧：会话历史 ── -->
  <aside class="session-sidebar" id="session-sidebar">
    <header class="session-sidebar-header">
      <h3>会话</h3>
      <button id="new-session-btn" class="session-new-btn" title="新对话">+</button>
    </header>
    <div class="session-list" id="session-list">
      <!-- JS 动态渲染 -->
    </div>
  </aside>

  <!-- ── 中间：聊天画布 ── -->
  <div class="chat-container">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="section-header-line"></div>
        <div>
          <h1 class="chat-title">AI 助手</h1>
          <div class="chat-subtitle">基于新闻数据的智能问答</div>
        </div>
      </div>
      <div class="chat-header-right">
        <div class="chat-header-controls">
          <div class="mode-segmented" role="tablist" aria-label="运行模式">
            <button class="mode-seg active" data-mode="strict" role="tab" aria-selected="true">
              <span class="mode-icon">🔒</span>Strict
            </button>
            <button class="mode-seg" data-mode="normal" role="tab" aria-selected="false">
              <span class="mode-icon">⚡</span>Normal
            </button>
            <button class="mode-seg" data-mode="loose" role="tab" aria-selected="false">
              <span class="mode-icon">🔄</span>Loose
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>
        </div>
        <div class="chat-empty-title">有什么想了解的？</div>
        <div class="chat-empty-desc">问我任何关于市场热点、个股动态或行业趋势的问题，我会基于 NewsRadar 的新闻数据为你分析。</div>
        <div class="chat-suggestions">
          <button class="chat-suggestion" data-prompt="今天市场有什么热点？">今天市场有什么热点？</button>
          <button class="chat-suggestion" data-prompt="帮我分析一下当前的舆论情绪">帮我分析一下当前的舆论情绪</button>
          <button class="chat-suggestion" data-prompt="最近有哪些值得关注的个股动态？">最近有哪些值得关注的个股动态？</button>
        </div>
      </div>
    </div>

    <div class="chat-composer">
      <div class="composer-shell" id="composer-shell">
        <div class="composer-input-row">
          <textarea
            id="chat-input"
            class="chat-input"
            placeholder="输入消息，向 AI 助手提问…"
            rows="1"
          ></textarea>
          <div class="composer-actions">
            <button id="send-btn" class="send-btn" title="发送 (Enter)" aria-label="发送" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
            <button id="stop-btn" class="stop-btn hidden" title="停止生成" aria-label="停止生成">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-footer">
          <div class="composer-hint">
            <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行
          </div>
          <select id="model-select" class="model-select" aria-label="模型选择">
            <option value="default">Default</option>
            <option value="quick">Quick</option>
            <option value="deep">Deep</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 右侧：智能体列表 ── -->
  <aside class="agent-sidebar" id="agent-sidebar">
    <header class="agent-sidebar-header">
      <div class="section-header-line"></div>
      <div>
        <h2 class="agent-sidebar-title">智能体</h2>
        <div class="agent-sidebar-subtitle">选一个角色对话</div>
      </div>
    </header>
    <div class="agent-list" id="agent-list"></div>
    <footer class="agent-sidebar-footer">
      <span class="agent-hint" id="agent-hint">默认助手 · 或勾选角色</span>
    </footer>
  </aside>
</div>

<!-- ── Tool Approval Dialog ── -->
<div class="approval-overlay hidden" id="approval-overlay">
  <div class="approval-dialog">
    <div class="approval-header">
      <span class="approval-badge" id="approval-badge">Level 3</span>
      <span class="approval-title">工具调用需要授权</span>
    </div>
    <div class="approval-body">
      <div class="approval-field">
        <label>工具</label>
        <code id="approval-tool-name">—</code>
      </div>
      <div class="approval-field">
        <label>参数</label>
        <pre id="approval-tool-args">—</pre>
      </div>
    </div>
    <div class="approval-reason-row">
      <textarea id="approval-reason" class="approval-reason" placeholder="拒绝理由（可选）" rows="2"></textarea>
    </div>
    <div class="approval-actions">
      <button id="approval-reject-btn" class="approval-btn reject">拒绝</button>
      <button id="approval-approve-btn" class="approval-btn approve">批准</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  'use strict';

  var SPARKLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/></svg>';
  var USER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

  var messagesEl = document.getElementById('chat-messages');
  var inputEl = document.getElementById('chat-input');
  var sendBtn = document.getElementById('send-btn');
  var stopBtn = document.getElementById('stop-btn');
  var modelSelect = document.getElementById('model-select');
  var suggestions = document.querySelectorAll('.chat-suggestion');
  var currentModel = 'quick';
  var currentMode = 'strict';
  var selectedPersonas = [];          // 选中的角色名（空 = 默认助手；>=2 = 团队会诊）
  var currentAgentId = '';           // 当前选中的智能体 ID
  var sessionId = null;
  var ws = null;
  var isGenerating = false;
  var currentBubble = null;
  var pendingRequestId = null;

  var agentListEl = document.getElementById('agent-list');
  var pendingResolve = null;

  // ── WebSocket 连接 ──
  function connectWS() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = protocol + '//' + location.host + '/api/ws';
    if (currentAgentId) {
      url += '?agent_id=' + encodeURIComponent(currentAgentId);
    }
    ws = new WebSocket(url);

    ws.onopen = function() { console.log('[WS] connected'); };
    ws.onmessage = function(e) {
      try { handleMessage(JSON.parse(e.data)); }
      catch (err) { console.error('[WS] parse error', err); }
    };
    ws.onclose = function() {
      console.log('[WS] disconnected, reconnecting in 3s...');
      setTimeout(connectWS, 3000);
    };
    ws.onerror = function(err) { console.error('[WS] error', err); };
  }

  function handleMessage(data) {
    switch (data.type) {
      case 'token': appendToken(data.content); break;
      case 'done':  finishMessage(data); break;
      case 'error': showError(data.message); break;
      case 'tool_approval_request': showApprovalDialog(data); break;
      case 'team_thinking': showTeamThinking(data.personas || []); break;
      case 'signals': renderSignals(data.signals || []); break;
    }
  }

  // ── 团队会诊：阶段状态 + 信号 chips ──
  function showTeamThinking(personas) {
    var bubble = ensureBubble();
    var content = bubble.querySelector('.bubble-content');
    content.innerHTML = '<div class="team-thinking">'
      + '<div class="typing-dots"><span></span><span></span><span></span></div>'
      + '<span class="team-thinking-label">团队分析中（' + personas.length
      + ' 个角色）…</span></div>';
    scrollToBottom();
  }

  function stanceClass(stance) {
    if (stance === '看多') return 'bull';
    if (stance === '看空') return 'bear';
    return 'neutral';
  }

  function renderSignals(signals) {
    var bubble = ensureBubble();
    var content = bubble.querySelector('.bubble-content');
    content.innerHTML = '';
    if (signals.length) {
      var chips = document.createElement('div');
      chips.className = 'signal-chips';
      signals.forEach(function(s) {
        var chip = document.createElement('span');
        chip.className = 'signal-chip stance-' + stanceClass(s.stance);
        var label = (s.display_name || s.persona || '?') + ' · ' + (s.stance || '?');
        if (s.confidence) label += ' ' + s.confidence;
        chip.textContent = label;
        chips.appendChild(chip);
      });
      content.appendChild(chips);
    }
    var reply = document.createElement('div');
    reply.className = 'reply-text';
    content.appendChild(reply);
    scrollToBottom();
  }

  // ── 消息渲染 ──
  function ensureBubble() {
    if (currentBubble) return currentBubble;
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    currentBubble = document.createElement('div');
    currentBubble.className = 'chat-bubble assistant';
    currentBubble.innerHTML =
      '<div class="bubble-avatar">' + SPARKLE_SVG + '</div>' +
      '<div class="bubble-content"></div>';
    messagesEl.appendChild(currentBubble);
    return currentBubble;
  }

  function showTyping() {
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    currentBubble = document.createElement('div');
    currentBubble.className = 'chat-bubble assistant';
    currentBubble.innerHTML =
      '<div class="bubble-avatar">' + SPARKLE_SVG + '</div>' +
      '<div class="bubble-content"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(currentBubble);
    scrollToBottom();
  }

  function appendToken(token) {
    var bubble = ensureBubble();
    var content = bubble.querySelector('.bubble-content');
    var reply = content.querySelector('.reply-text');
    if (reply) {
      // 团队模式：tokens 追加到信号 chips 下的回复容器
      reply.textContent += token;
    } else {
      // 流式渲染期间：清掉 typing 占位，仅用 textContent 累加，避免 XSS 与性能问题
      if (content.querySelector('.typing-dots')) content.innerHTML = '';
      content.textContent += token;
    }
    scrollToBottom();
  }

  function finishMessage(data) {
    if (currentBubble) {
      var content = currentBubble.querySelector('.bubble-content');
      var reply = content.querySelector('.reply-text');
      if (reply) {
        // 团队模式：保留信号 chips，仅对回复文本做 Markdown 渲染
        try {
          reply.innerHTML = marked.parse(reply.textContent);
        } catch (e) { /* marked 加载失败时保留纯文本 */ }
      } else if (content.querySelector('.typing-dots')) {
        // 没有收到任何 token
        currentBubble.remove();
      } else {
        // 完成时（含被停止）做一次 Markdown 渲染，marked 能优雅处理不完整内容
        try {
          content.innerHTML = marked.parse(content.textContent);
        } catch (e) {
          /* marked 加载失败时保留纯文本 */
        }
      }
    }
    currentBubble = null;
    setGenerating(false);
  }

  function showError(msg) {
    // 移除仍在 typing 的占位气泡
    if (currentBubble && currentBubble.querySelector('.typing-dots')) {
      currentBubble.remove();
    }
    currentBubble = null;

    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    var el = document.createElement('div');
    el.className = 'chat-bubble error';
    el.innerHTML = '<div class="bubble-content">⚠️ ' + escapeHtml(msg) + '</div>';
    messagesEl.appendChild(el);
    setGenerating(false);
    scrollToBottom();
  }

  function addUserMessage(text) {
    var empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    var el = document.createElement('div');
    el.className = 'chat-bubble user';
    el.innerHTML =
      '<div class="bubble-avatar">' + USER_SVG + '</div>' +
      '<div class="bubble-content">' + escapeHtml(text) + '</div>';
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  // ── 发送消息 ──
  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text || isGenerating) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showError('连接未就绪，请稍后重试');
      return;
    }

    if (!sessionId) {
      createSession().then(function() { doSend(text); });
    } else {
      doSend(text);
    }
  }

  function doSend(text) {
    addUserMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    updateSendState();
    setGenerating(true);
    showTyping();

    ws.send(JSON.stringify({
      type: 'chat',
      session_id: sessionId,
      message: text,
      model: currentModel,
      running_mode: currentMode,
      persona: selectedPersonas,
    }));
  }

  function stopGeneration() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
    }
    setGenerating(false);
  }

  function setGenerating(generating) {
    isGenerating = generating;
    sendBtn.classList.toggle('hidden', generating);
    stopBtn.classList.toggle('hidden', !generating);
    inputEl.disabled = generating;
    if (!generating) updateSendState();
  }

  function updateSendState() {
    sendBtn.disabled = isGenerating || inputEl.value.trim() === '';
  }

  // ── Session 管理 ──
  async function createSession() {
    var resp = await fetch('/api/agent/sessions', { method: 'POST' });
    var data = await resp.json();
    sessionId = data.id;
    loadSessions();
    return sessionId;
  }

  async function loadSessions() {
    try {
      var resp = await fetch('/api/agent/sessions?page=1&page_size=50');
      var data = await resp.json();
      var el = document.getElementById('session-list');
      el.innerHTML = '';
      if (data.sessions) {
        data.sessions.forEach(function(s) {
          var item = document.createElement('div');
          item.className = 'session-list-item' + (s.id === sessionId ? ' active' : '');
          item.textContent = s.title || '新会话';
          item.dataset.sid = s.id;
          item.addEventListener('click', function() { switchSession(s.id); });
          el.appendChild(item);
        });
      }
    } catch (e) {
      console.error('[sessions] load error', e);
    }
  }

  function switchSession(sid) {
    if (sid === sessionId) return;
    sessionId = sid;
    // 高亮当前会话
    document.querySelectorAll('.session-list-item').forEach(function(item) {
      item.classList.toggle('active', item.dataset.sid === sid);
    });
    // 清空聊天并加载历史
    messagesEl.innerHTML = '';
    var empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.id = 'chat-empty';
    empty.innerHTML = '<div class="chat-empty-avatar">' + SPARKLE_SVG + '</div>'
      + '<div class="chat-empty-title">会话已切换</div>'
      + '<div class="chat-empty-desc">开始新对话</div>';
    messagesEl.appendChild(empty);
    currentBubble = null;
    // 异步加载历史消息
    loadMessages(sid);
  }

  async function loadMessages(sid) {
    try {
      var resp = await fetch('/api/agent/sessions/' + sid + '/messages');
      var data = await resp.json();
      var empty = document.getElementById('chat-empty');
      if (data.messages && data.messages.length > 0) {
        if (empty) empty.remove();
        data.messages.forEach(function(m) {
          var el = document.createElement('div');
          if (m.role === 'user') {
            el.className = 'chat-bubble user';
            el.innerHTML =
              '<div class="bubble-avatar">' + USER_SVG + '</div>' +
              '<div class="bubble-content">' + escapeHtml(m.content) + '</div>';
          } else {
            el.className = 'chat-bubble assistant';
            var contentHtml = m.content;
            try {
              contentHtml = marked.parse(m.content);
            } catch (e) { /* 保留纯文本 */ }
            el.innerHTML =
              '<div class="bubble-avatar">' + SPARKLE_SVG + '</div>' +
              '<div class="bubble-content">' + contentHtml + '</div>';
          }
          messagesEl.appendChild(el);
        });
        scrollToBottom();
      }
    } catch (e) {
      console.error('[messages] load error', e);
    }
  }

  // ── 智能体列表（从 /api/agents 加载） ──
  function agentCardHtml(id, name, desc, selected) {
    return '<button class="agent-card' + (selected ? ' active' : '') + '"'
      + ' data-agent-id="' + escapeHtml(id) + '"'
      + ' role="checkbox" aria-checked="' + (selected ? 'true' : 'false') + '">'
      + '<div class="agent-card-name">' + escapeHtml(name) + '</div>'
      + '<div class="agent-card-desc">' + escapeHtml(desc || '') + '</div>'
      + '</button>';
  }

  function refreshAgentCardStates() {
    agentListEl.querySelectorAll('.agent-card').forEach(function(c) {
      var aid = c.dataset.agentId;
      var on = (!aid && selectedPersonas.length === 0)
        || (aid && selectedPersonas.indexOf(aid) >= 0);
      c.classList.toggle('active', on);
      c.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  function updateAgentHint() {
    var hint = document.getElementById('agent-hint');
    if (!hint) return;
    if (selectedPersonas.length === 0) {
      hint.textContent = '默认助手 · 或勾选角色';
    } else if (selectedPersonas.length === 1) {
      hint.textContent = '单角色对话';
    } else {
      hint.textContent = '团队会诊 · ' + selectedPersonas.length + ' 个角色';
    }
  }

  async function loadAgents() {
    var data;
    try {
      var resp = await fetch('/api/agents');
      data = await resp.json();
    } catch (e) {
      return;  // 接口不可用，保持面板为空
    }
    if (!data || !data.agents || !data.agents.length) return;

    // 默认助手卡（data-agent-id="" -> 走默认 agent；选中态 = 未选任何角色）
    var html = agentCardHtml('', '默认助手', '通用 NewsRadar 助手', true);

    data.agents.forEach(function(a) {
      html += agentCardHtml(a.id, a.name, a.description, false);
    });

    agentListEl.innerHTML = html;
    refreshAgentCardStates();
    updateAgentHint();

    // 多选切换：点角色卡 toggle；点默认助手清空全部
    agentListEl.querySelectorAll('.agent-card').forEach(function(card) {
      card.addEventListener('click', function() {
        if (isGenerating) return;
        var aid = card.dataset.agentId;
        if (!aid) {
          selectedPersonas = [];
        } else {
          var idx = selectedPersonas.indexOf(aid);
          if (idx >= 0) selectedPersonas.splice(idx, 1);
          else selectedPersonas.push(aid);
        }
        refreshAgentCardStates();
        updateAgentHint();
      });
    });
  }

  function switchAgent(agentId) {
    currentAgentId = agentId;
    // 重新连接 WebSocket 以传递 agent_id
    if (ws) {
      ws.onclose = null;  // 避免触发重连逻辑
      ws.close();
    }
    connectWS();
  }

  // ── 初始化 ──
  async function init() {
    try {
      var resp = await fetch('/api/agent/sessions?page=1&page_size=1');
      var data = await resp.json();
      if (data.sessions && data.sessions.length > 0) {
        sessionId = data.sessions[0].id;
      } else {
        await createSession();
      }
    } catch (e) {
      await createSession();
    }
    loadSessions();   // 加载会话列表
    loadAgents();     // 加载智能体列表
    connectWS();
  }

  // ── 辅助函数 ──
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── 事件绑定 ──
  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', stopGeneration);

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    updateSendState();
  });

  // ── 模型选择下拉 ──
  modelSelect.value = 'quick';
  modelSelect.addEventListener('change', function() {
    if (isGenerating) return;
    currentModel = modelSelect.value;
  });

  suggestions.forEach(function(chip) {
    chip.addEventListener('click', function() {
      inputEl.value = chip.dataset.prompt;
      inputEl.focus();
      inputEl.dispatchEvent(new Event('input'));
    });
  });

  // ── 运行模式切换 ──
  var modeSegs = document.querySelectorAll('.mode-seg');
  modeSegs.forEach(function(seg) {
    seg.addEventListener('click', function() {
      if (isGenerating) return;
      modeSegs.forEach(function(s) {
        s.classList.remove('active');
        s.setAttribute('aria-selected', 'false');
      });
      seg.classList.add('active');
      seg.setAttribute('aria-selected', 'true');
      currentMode = seg.dataset.mode;
    });
  });

  // ── 新建会话 ──
  document.getElementById('new-session-btn').addEventListener('click', async function() {
    if (isGenerating) return;
    await createSession();
    messagesEl.innerHTML = '';
    var empty = document.createElement('div');
    empty.className = 'chat-empty';
    empty.id = 'chat-empty';
    empty.innerHTML = '<div class="chat-empty-avatar">' + SPARKLE_SVG + '</div>'
      + '<div class="chat-empty-title">有什么想了解的？</div>'
      + '<div class="chat-empty-desc">问我任何关于市场热点、个股动态或行业趋势的问题，我会基于 NewsRadar 的新闻数据为你分析。</div>'
      + '<div class="chat-suggestions">'
      + '<button class="chat-suggestion" data-prompt="今天市场有什么热点？">今天市场有什么热点？</button>'
      + '<button class="chat-suggestion" data-prompt="帮我分析一下当前的舆论情绪">帮我分析一下当前的舆论情绪</button>'
      + '<button class="chat-suggestion" data-prompt="最近有哪些值得关注的个股动态？">最近有哪些值得关注的个股动态？</button>'
      + '</div>';
    messagesEl.appendChild(empty);
    currentBubble = null;
    // 重新绑定建议按钮
    document.querySelectorAll('.chat-suggestion').forEach(function(chip) {
      chip.addEventListener('click', function() {
        inputEl.value = chip.dataset.prompt;
        inputEl.focus();
        inputEl.dispatchEvent(new Event('input'));
      });
    });
  });

  // ── 工具授权弹窗 ──
  var approvalOverlay = document.getElementById('approval-overlay');
  var approvalToolName = document.getElementById('approval-tool-name');
  var approvalToolArgs = document.getElementById('approval-tool-args');
  var approvalBadge = document.getElementById('approval-badge');
  var approvalReason = document.getElementById('approval-reason');
  var approveBtn = document.getElementById('approval-approve-btn');
  var rejectBtn = document.getElementById('approval-reject-btn');

  function showApprovalDialog(data) {
    pendingRequestId = data.request_id;
    approvalToolName.textContent = data.tool.name || '—';
    approvalToolArgs.textContent = JSON.stringify(data.args, null, 2) || '—';
    var level = data.tool.level || 0;
    if (level >= 3) {
      approvalBadge.textContent = 'Level ' + level;
      approvalBadge.style.background = '#fdf0f0';
      approvalBadge.style.color = '#c93a3a';
    } else if (level >= 2) {
      approvalBadge.textContent = 'Level ' + level;
      approvalBadge.style.background = '#fff5f0';
      approvalBadge.style.color = '#f25f0f';
    } else {
      approvalBadge.textContent = 'Level ' + level;
      approvalBadge.style.background = '#f0faf4';
      approvalBadge.style.color = '#1a8a4a';
    }
    approvalReason.value = '';
    approvalOverlay.classList.remove('hidden');
  }

  function hideApprovalDialog() {
    approvalOverlay.classList.add('hidden');
    pendingRequestId = null;
  }

  approveBtn.addEventListener('click', function() {
    if (!pendingRequestId || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: 'tool_approval_response',
      request_id: pendingRequestId,
      approved: true,
    }));
    hideApprovalDialog();
  });

  rejectBtn.addEventListener('click', function() {
    if (!pendingRequestId || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type: 'tool_approval_response',
      request_id: pendingRequestId,
      approved: false,
      reason: approvalReason.value.trim() || '用户拒绝',
    }));
    hideApprovalDialog();
  });

  // 点击遮罩层等同于拒绝
  approvalOverlay.addEventListener('click', function(e) {
    if (e.target === approvalOverlay) {
      rejectBtn.click();
    }
  });

  // ── 启动 ──
  init();
})();
</script>
{% endblock %}
