{% extends "base.html" %}
{% block title %}NewsRadar · 热点新闻{% endblock %}

{% block content %}
<div class="app-main">

  <!-- Cards area (scrollable) -->
  <div class="content-cards">

    <!-- Section Header -->
    <div class="section-header">
      <div class="section-header-line"></div>
      <h1>热点新闻</h1>
      <span class="date">{{ today_date }}</span>
      <!-- Panel toggle button -->
      <label for="panel-toggle" class="panel-toggle-btn" style="margin-left:12px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        全部新闻
      </label>
    </div>

    <!-- Control Deck -->
    {% include "components/control_deck.html" %}

    <!-- Masonry Cards -->
    {% include "components/news_cards.html" %}

  </div>

  <!-- Right Panel (slide-in) -->
  {% include "components/news_list.html" %}

</div>
{% endblock %}
