<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NewsRadar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body>

<div class="app-shell">
  {% include "components/sidebar.html" %}
  {% block content %}{% endblock %}
</div>

</body>
<!-- Shared: notification polling + toast + drawer -->
<script>
(function() {
  'use strict';

  var POLL_INTERVAL = 5000;
  var TOAST_DURATION = 5000;
  var shownIds = {};   // track which notifs already toasted

  // ── Toast ──
  // Builds a toast node from a normalized descriptor:
  //   { title, sub, kind: 'done'|'fail'|'info', onClick: fn|null }
  function buildToast(opts) {
    var container = document.getElementById('toast-container');
    if (!container) return null;

    var toast = document.createElement('div');
    toast.className = 'toast ' + (opts.kind === 'fail' ? 'fail' : 'done');

    var body = document.createElement('div');
    body.className = 'toast-body';

    var title = document.createElement('div');
    title.className = 'toast-title';
    title.innerHTML = '<span class="dot"></span>' + escapeHtml(opts.title);

    var sub = document.createElement('div');
    sub.className = 'toast-sub';
    sub.textContent = opts.sub;

    body.appendChild(title);
    body.appendChild(sub);
    toast.appendChild(body);

    if (opts.onClick) {
      toast.style.cursor = 'pointer';
      toast.addEventListener('click', opts.onClick);
    } else {
      toast.style.cursor = 'default';
    }

    container.appendChild(toast);

    setTimeout(function() {
      toast.classList.add('fading');
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 300);
    }, opts.duration || TOAST_DURATION);
    return toast;
  }

  function showToast(notif) {
    buildToast({
      title: notif.title,
      sub: notif.status === 'completed' ? '抓取完成' : '抓取失败',
      kind: notif.status === 'completed' ? 'done' : 'fail',
      onClick: function() { window.location.href = '/news/' + notif.article_id; },
    });
  }

  // Generic toast for ad-hoc UI flows (e.g. delete). Exposed globally so
  // page scripts injected via the per-page scripts block can reuse the
  // shared visual system without a second toast implementation.
  window.showAppToast = function(title, sub, kind, onClick) {
    buildToast({ title: title, sub: sub || '', kind: kind || 'done',
                 onClick: onClick || null });
  };

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── Badge ──
  function updateBadge(count) {
    var badge = document.getElementById('bell-badge');
    if (!badge) return;
    badge.setAttribute('data-count', count);
    badge.textContent = count;
    badge.style.animation = 'none';
    badge.offsetHeight;
    badge.style.animation = '';
  }

  // ── Drawer ──
  window.toggleDrawer = function() {
    var drawer = document.getElementById('notify-drawer');
    var overlay = document.getElementById('notify-overlay');
    if (!drawer || !overlay) return;
    if (drawer.classList.contains('is-open')) {
      closeDrawer();
    } else {
      drawer.classList.add('is-open');
      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      fetchNotifications(true);
    }
  };

  window.closeDrawer = function() {
    var drawer = document.getElementById('notify-drawer');
    var overlay = document.getElementById('notify-overlay');
    if (!drawer || !overlay) return;
    drawer.classList.remove('is-open');
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
    // Mark all shown as read
    var list = document.getElementById('notify-list');
    if (list) {
      var items = list.querySelectorAll('.notify-item');
      items.forEach(function(item) {
        var id = item.getAttribute('data-id');
        if (id) {
          fetch('/api/notifications/' + id + '/read', { method: 'POST' });
        }
      });
    }
    updateBadge(0);
  };

  // ── Fetch ──
  function fetchNotifications(forDrawer) {
    fetch('/api/notifications?unread_only=true')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!Array.isArray(data)) return;

        if (forDrawer) {
          renderDrawerList(data);
        }

        data.forEach(function(n) {
          if (!shownIds[n.id] && (n.status === 'completed' || n.status === 'failed')) {
            shownIds[n.id] = true;
            // Only toast on hot-news or detail pages
            var path = window.location.pathname;
            if (path.indexOf('/hot-news') === 0 || path.indexOf('/news/') === 0) {
              showToast(n);
            }
          }
        });
      })
      .catch(function() { /* ignore network errors */ });
  }

  function fetchUnreadCount() {
    fetch('/api/notifications/unread-count')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        updateBadge(data.count || 0);
        if (data.count > 0) {
          fetchNotifications(false);
        }
      })
      .catch(function() {});
  }

  function renderDrawerList(data) {
    var list = document.getElementById('notify-list');
    if (!list) return;

    if (data.length === 0) {
      list.innerHTML = '<div class="notify-empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' +
        '<span>暂无未读消息</span></div>';
      return;
    }

    var html = '';
    data.forEach(function(n) {
      var dotClass = n.status === 'completed' ? 'done' : n.status === 'failed' ? 'fail' : 'running';
      var statusClass = n.status === 'completed' ? 'done' : n.status === 'failed' ? 'fail' : 'running';
      var statusText = n.status === 'completed' ? '已完成' : n.status === 'failed' ? '失败' : '抓取中';

      html +=
        '<div class="notify-item" data-id="' + escapeAttr(n.id) + '" onclick="window.location.href=\'/news/' + escapeAttr(n.article_id) + '\'">' +
          '<span class="notify-item-dot ' + dotClass + '"></span>' +
          '<div class="notify-item-body">' +
            '<div class="notify-item-title">' + escapeHtml(n.title) + '</div>' +
            '<div class="notify-item-meta">' +
              '<span class="notify-item-status ' + statusClass + '">' + statusText + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    });
    list.innerHTML = html;
  }

  // ── Polling ──
  // Only active on hot-news and news detail pages
  var path = window.location.pathname;
  if (path.indexOf('/hot-news') === 0 || path.indexOf('/news/') === 0) {
    // Create toast container if not present
    if (!document.getElementById('toast-container')) {
      var tc = document.createElement('div');
      tc.className = 'toast-container';
      tc.id = 'toast-container';
      document.body.appendChild(tc);
    }

    fetchUnreadCount();
    setInterval(fetchUnreadCount, POLL_INTERVAL);
  }
})();
</script>
{% block scripts %}{% endblock %}
</html>
