version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: newsradar-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: newsradar
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradar -d newsradar"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: newsradar-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
