services:
  postgres:
    # pgvector/pgvector:pg16 = 官方 PG16 + pgvector 扩展（vanilla postgres:16-alpine 无 pgvector）
    # 数据卷与 postgres:16 同主版本兼容，切换镜像无需迁移数据，仅需重建容器
    image: pgvector/pgvector:pg16
    container_name: newsradar-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: newsradar
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradar -d newsradar"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    # MinIO 社区版已归档：官方镜像从 Docker Hub/Quay 删除，源码停止维护。
    # 这里用 Silo —— Pigsty 维护的 MinIO fork，S3 API / MINIO_* 环境变量 /
    # .minio.sys 磁盘格式 / console 端口全部兼容，属于原地替换（无需数据迁移）。
    # 备选：ifirestone/minio:RELEASE.2026-09-22T19-25-18Z（Chainguard 构建的上游归档代码）。
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: newsradar-minio
    # 数据卷内的文件由旧镜像以 root 写入，显式用 root 运行以免挂载卷不可写。
    user: "0:0"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    command: server /data --console-address ":9001"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: newsradar_postgres_data
  minio_data:
    name: newsradar_minio_data
  minio_config:
    name: newsradar_minio_config
