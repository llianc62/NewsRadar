name: Notify News

on:
  schedule:
    - cron: "0 0,4,8,14 * * *"  # Beijing 8:00, 12:00, 16:00, 22:00 = UTC 0,4,8,14
  workflow_dispatch:

concurrency:
  group: notifier-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Get last notify time
        id: last_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(gh run list \
            --workflow notifier.yml \
            --branch master \
            --status success \
            --limit 1 \
            --json createdAt \
            --jq '.[0].createdAt // ""' || echo "")
          echo "since=$SINCE" >> $GITHUB_OUTPUT

      - name: Run notifier
        env:
          CLOUD_S3_ENDPOINT_URL: ${{ secrets.CLOUD_S3_ENDPOINT_URL }}
          CLOUD_S3_BUCKET_NAME: ${{ secrets.CLOUD_S3_BUCKET_NAME }}
          CLOUD_S3_ACCESS_KEY_ID: ${{ secrets.CLOUD_S3_ACCESS_KEY_ID }}
          CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_S3_SECRET_ACCESS_KEY }}
          CLOUD_S3_REGION: ${{ secrets.CLOUD_S3_REGION }}
          EMAIL_FROM_ADDR: ${{ secrets.EMAIL_FROM_ADDR }}
          EMAIL_TO_ADDR: ${{ secrets.EMAIL_TO_ADDR }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run python -m cli notify --start-time "${{ steps.last_run.outputs.since }}"
