name: Crawl News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run crawler
        env:
          CLOUD_S3_ENDPOINT_URL: ${{ secrets.CLOUD_S3_ENDPOINT_URL }}
          CLOUD_S3_BUCKET_NAME: ${{ secrets.CLOUD_S3_BUCKET_NAME }}
          CLOUD_S3_ACCESS_KEY_ID: ${{ secrets.CLOUD_S3_ACCESS_KEY_ID }}
          CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_S3_SECRET_ACCESS_KEY }}
          CLOUD_S3_REGION: ${{ secrets.CLOUD_S3_REGION }}
        run: uv run python -m cli crawl
